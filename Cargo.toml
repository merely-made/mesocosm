[package]
name = "mesocosm"
version = "0.0.2"
edition = "2024"
license = "MPL-2.0"
description = "Name reservation. Mesocosm is a first-person game of lineages: you are a critter in an enclosed mid-scale ecosystem, you grow by incorporating other organisms, and you try to make your kind matter."
repository = "https://github.com/merely-made/mesocosm"
readme = "README.md"
keywords = ["game", "ecosystem", "evolution", "voxel", "simulation"]
categories = ["games"]
exclude = ["design_docs/"]

# Own workspace root. The reservation package plus the crates that have split
# out so far.
#
# Game and application crates use MPL-2.0. A genuinely reusable library may
# declare MIT OR Apache-2.0 in its own manifest after its boundary is proven.
[workspace]
members = ["crates/mesocosm-core", "crates/mesocosm-mesh", "crates/mesocosm-runtime"]

[workspace.dependencies]
mesocosm-core = { path = "crates/mesocosm-core", version = "0.0.1" }
mesocosm-mesh = { path = "crates/mesocosm-mesh", version = "0.0.1" }
mesocosm-runtime = { path = "crates/mesocosm-runtime", version = "0.0.1" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[dependencies]
